<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 440">
  <!-- Rounded Squircle Box -->
  <rect x="20" y="20" width="360" height="360" rx="72" fill="#11141a" />
  
  <!-- Vertical Circuit Wire Lines -->
  <line x1="200" y1="20" x2="200" y2="135" stroke="#333942" stroke-width="8" stroke-linecap="round" />
  <line x1="200" y1="285" x2="200" y2="380" stroke="#333942" stroke-width="8" stroke-linecap="round" />

  <!-- Diagonal Switch Arm (Green) -->
  <line x1="200" y1="135" x2="275" y2="265" stroke="#3fb950" stroke-width="24" stroke-linecap="round" />

  <!-- Top Green Terminal Dot -->
  <circle cx="200" cy="135" r="26" fill="#3fb950" />

  <!-- Bottom Red Terminal Dot -->
  <circle cx="200" cy="285" r="26" fill="#f85149" />

  <!-- Text: circuit breaker -->
  <text x="200" y="425" text-anchor="middle" fill="#e6edf3" font-family="'JetBrains Mono', monospace" font-size="28" font-weight="500" letter-spacing="1">circuit breaker</text>
</svg>
